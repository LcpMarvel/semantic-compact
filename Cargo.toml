[package]
name = "semantic-compact"
version = "0.2.8"
edition = "2021"
description = "Claude Code plugin: suggests /compact or /clear when a new task begins — task-boundary detection, reminder only"
license = "MIT"

[lib]
name = "semantic_compact"
path = "src/lib.rs"

[[bin]]
name = "semantic-compact"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
