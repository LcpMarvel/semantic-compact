name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: sh scripts/test-setup.sh
      - name: Keep plugin manifest and crate version in sync
        run: |
          crate_v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          plugin_v="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -n1)"
          [ "$crate_v" = "$plugin_v" ] || {
            echo "Cargo.toml ($crate_v) and plugin.json ($plugin_v) versions differ" >&2; exit 1;
          }
