name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no leading v); ignored when from_tag is set"
        required: false
      from_tag:
        description: "Existing tag to backfill a release from, e.g. v0.2.9 (no bump, no new tag)"
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize and validate version
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          from_tag="${{ github.event.inputs.from_tag }}"
          case "$v" in v*) v="${v#v}" ;; esac
          case "$from_tag" in v*) from_tag="${from_tag#v}" ;; esac
          if [ -n "$v" ] && [ -n "$from_tag" ]; then
            echo "pass either version or from_tag, not both" >&2; exit 1
          fi
          if [ -n "$from_tag" ]; then
            # Backfill: build the release from a tag that already exists on origin.
            git fetch --no-tags origin "refs/tags/v$from_tag:refs/tags/v$from_tag" || {
              echo "tag v$from_tag not found on origin" >&2; exit 1;
            }
            c="$(git rev-list -n1 "refs/tags/v$from_tag")"
            [ -n "$c" ] || { echo "tag v$from_tag resolves to no commit" >&2; exit 1; }
            cv="$(git show "$c":Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)"
            pv="$(git show "$c":.claude-plugin/plugin.json | sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' | head -n1)"
            if [ "$cv" != "$from_tag" ] || [ "$pv" != "$from_tag" ]; then
              echo "tag v$from_tag carries Cargo.toml=$cv plugin.json=$pv, expected $from_tag" >&2; exit 1
            fi
            echo "version=$from_tag" >> "$GITHUB_OUTPUT"
            echo "tag=v$from_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "invalid version: $v" >&2; exit 1;
          }
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "tag v$v already exists" >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Bump versions
        if: ${{ github.event.inputs.from_tag == '' }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          sed -i.bak "s/^version = \".*\"/version = \"$v\"/" Cargo.toml && rm Cargo.toml.bak
          sed -i.bak "s/\"version\": *\"[^\"]*\"/\"version\": \"$v\"/" .claude-plugin/plugin.json && rm .claude-plugin/plugin.json.bak
          grep -q "\"version\": \"$v\"" .claude-plugin/plugin.json
          cargo update --workspace
      - name: Commit and tag
        if: ${{ github.event.inputs.from_tag == '' }}
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Cargo.toml Cargo.lock .claude-plugin/plugin.json
          git commit --allow-empty -m "release v${{ steps.ver.outputs.version }}"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "HEAD:main" "${{ steps.ver.outputs.tag }}"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Rename asset
        run: |
          cp "target/${{ matrix.target }}/release/semantic-compact" "semantic-compact-${{ matrix.target }}"
          { shasum -a 256 "semantic-compact-${{ matrix.target }}" 2>/dev/null || sha256sum "semantic-compact-${{ matrix.target }}"; } >> "SHA256SUMS.part.${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: semantic-compact-${{ matrix.target }}
          path: |
            semantic-compact-${{ matrix.target }}
            SHA256SUMS.part.${{ matrix.target }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Merge checksums
        working-directory: dist
        run: cat SHA256SUMS.part.* > SHA256SUMS && rm SHA256SUMS.part.*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "semantic-compact ${{ needs.prepare.outputs.version }}" \
            --notes "Prebuilt binaries. The plugin Setup hook downloads the right one automatically; SHA256SUMS holds the checksums."
